# Review and test on SCCC before enabling; HTTPS is configured after DNS verification.
server {
    listen 80;
    server_name kfo.hexa16.sa;
    root /var/www/kfo/current;
    index index.html;
    access_log /var/log/nginx/kfo-access.log;
    error_log /var/log/nginx/kfo-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    location ~ /\. { deny all; }
    location ~ ^/(qa|review)(/|$) { return 404; }
    location = /auth-check { return 404; }
    location = /auth-check.html { return 404; }
    location / { try_files $uri $uri.html $uri/ =404; }
}
