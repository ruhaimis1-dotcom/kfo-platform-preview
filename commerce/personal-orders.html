<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>طلبات دوراتي — كفو</title><link rel="stylesheet" href="/assets/fonts.css"><link rel="stylesheet" href="/assets/orders.css"></head><body><main class="course-orders"><header><a href="/workspace">مساحتي</a><a href="/catalog">المواد التعليمية المجانية</a></header><h1>طلبات الدورات</h1><p>الدورات المجانية متاحة للتسجيل. الطلب المدفوع يتوقف عند خطوة الدفع إلى حين اكتمال ربط نيو ليب.</p><section><h2>طلب دورة</h2><form id="course-order-form" hidden><label>الدورة<select name="course" required></select></label><label hidden>عدد المستفيدين<input name="quantity" type="number" min="1" max="10000" value="1" required></label><p id="course-order-total"></p><button type="submit">متابعة الطلب</button></form><p id="course-order-status" role="status" aria-live="polite">جارٍ تحميل الطلبات…</p></section><section id="course-payment-step" hidden><h2>خطوة الدفع</h2><p>بوابة نيو ليب قيد الربط. الطلب بانتظار الدفع؛ لم يتم تحصيل مبلغ أو فتح دورة مدفوعة.</p><button type="button" disabled>الدفع غير متاح حاليًا</button></section><section><h2>سجل الطلبات</h2><button id="course-orders-refresh" type="button">تحديث السجل</button><div id="course-order-history"></div></section></main><script type="module" src="/assets/personal-orders.js"></script></body></html>
